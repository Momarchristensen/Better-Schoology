<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/logo.svg" />
  <title>Material</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/assignments-search.css" />
  <script src="/app.js"></script>
  <script src="/back.js"></script>
  <style>
    :root {
      --soft-panel: rgb(255 255 255 / 4%);
      --soft-border: rgb(255 255 255 / 8%);
      --link: #93c5fd;
      --muted-panel: #cbd5e1;
      --late-bg: rgb(255 107 107 / 14%);
      --late-text: #ff8a8a;
    }

    .page {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .header {
      margin-bottom: 18px;
    }

    .header-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .header-toolbar .back-btn,
    .header-toolbar .home-btn,
    .header-toolbar .settings-link {
      margin-bottom: 0;
    }

    .header-toolbar #assignments-search {
      flex: 0 1 480px;
      min-width: 0;
      width: min(100%, 480px);
    }

    .header-toolbar .search-bar {
      max-width: none;
      margin: 0;
    }

    @media (width <=480px) {
      .header-toolbar #assignments-search {
        flex: 0 0 auto;
        width: 100%;
      }
    }

    .material-action,
    .attachments-zip-button {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-strong);
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }

    .material-action:hover,
    .attachments-zip-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .attachments-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .header h2 {
      margin: 0;
      padding: 2px 4px;
      font-size: clamp(1.6rem, 2.4vw, 2.3rem);
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text-strong);
    }

    #material-viewer {
      display: grid;
      gap: 16px;
    }

    .panels,
    .description,
    .submissions-container,
    .attachments-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .panels {
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, auto);
      gap: 18px;
      align-items: start;
    }

    .left-panel {
      min-width: 0;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      min-width: 220px;
      max-width: 100%;
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted-panel);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .due-date {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .due-date-text {
      color: var(--text);
      font-weight: 600;
    }

    .due-date-countdown {
      color: var(--muted-panel);
      font-weight: 500;
    }

    .grade {
      text-align: right;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--soft-panel);
      border: 1px solid var(--soft-border);
    }

    .grade-score {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-strong);
    }

    .grade-comment {
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--muted-panel);
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .content-row {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr);
      gap: 16px;
      align-items: start;
    }

    .description {
      padding: 20px;
      line-height: 1.7;
      min-height: 100px;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .description-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted-panel);
      margin-bottom: 10px;
    }

    .description-content {
      background: var(--soft-panel);
      border: 1px solid var(--soft-border);
      border-radius: 12px;
      padding: 12px 14px;
      white-space: pre-line;
    }

    .description a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .submissions-container {
      padding: 18px;
      min-width: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    .left-content {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .submissions {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .submission {
      background: rgb(255 255 255 / 4.5%);
      border: 1px solid rgb(255 255 255 / 9%);
      border-radius: 16px;
      padding: 14px;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .submission:hover {
      transform: translateY(-2px);
      background: rgb(255 255 255 / 7%);
      border-color: rgb(255 255 255 / 14%);
    }

    .submission-dropzone {
      border: 2px dashed var(--soft-border);
      border-radius: 12px;
      padding: 14px;
      display: grid;
      gap: 10px;
      transition:
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .submission-dropzone.drag-over {
      border-color: var(--link);
      background: rgb(147 197 253 / 8%);
    }

    .submission-dropzone-hint {
      font-size: 0.85rem;
      color: var(--muted-panel);
      text-align: center;
      pointer-events: none;
    }

    .submission-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .submission-link {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--link);
      text-decoration: none;
    }

    .submission-link:hover {
      text-decoration: underline;
    }

    .late-text {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--late-bg);
      color: var(--late-text);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .late-text.show {
      display: inline-flex;
    }

    .submission-content {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .file-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgb(255 255 255 / 4%);
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .file-name {
      font-size: 0.92rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .download-btn {
      background: linear-gradient(180deg,
          var(--accent),
          var(--accent-strong));
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      transition:
        transform 0.18s ease,
        filter 0.18s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .submission-viewer {
      background: rgb(0 0 0 / 22%);
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: 12px;
      margin-top: 8px;
      padding: 12px;
      max-width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
      overflow-wrap: anywhere;
    }

    .submission-viewer * {
      max-width: 100%;
    }

    .submissions-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      margin-right: 8px;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      line-height: 1;
      text-decoration: none;
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        border-color 0.18s ease;
    }

    .home-btn:hover {
      background: rgb(255 255 255 / 10%);
      border-color: rgb(148 163 184 / 28%);
      transform: translateY(-1px);
    }

    .attachments-container {
      padding: 16px 18px;
      display: none;
    }

    .attachments-container.show {
      display: grid;
      gap: 10px;
    }

    .attachments-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted-panel);
    }

    .attachments {
      display: grid;
      gap: 8px;
    }

    .attachment-container {
      display: grid;
      gap: 8px;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .attachment-separator {
      width: 100%;
      height: 1px;
      background: rgb(255 255 255 / 12%);
      margin: 8px 0;
    }

    .attachment-download {
      flex: 0 0 auto;
      margin-left: 12px;
      width: 38px !important;
      height: 38px;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      background: rgb(255 255 255 / 6%);
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .attachment-download::before {
      content: "↓";
      transform: translateY(-1px);
    }

    .attachment-download:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: translateY(-1px);
    }

    .attachment-download:active {
      transform: translateY(0);
    }

    .attachment-file {
      display: block;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--link);
      text-decoration: none;
    }

    .attachment-file:hover {
      text-decoration: underline;
    }

    .attachment-row {
      display: flex;
      flex-flow: row wrap;
      align-items: center;
      width: 100%;
      gap: 10px;
      min-width: 0;
    }

    .attachment-link {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgb(255 255 255 / 4%);
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--link);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
      min-width: 0;
      max-width: 100%;
    }

    .attachment-link:hover {
      background: rgb(255 255 255 / 7%);
      border-color: rgb(255 255 255 / 14%);
      transform: translateY(-1px);
    }

    .attachment-link::before {
      content: "🔗";
      font-size: 0.9rem;
    }

    .pdf-container {
      width: 100%;
      position: relative;
    }

    .pdf-container:fullscreen {
      background: var(--bg);
      padding: 16px;
    }

    .pdf-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .pdf-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgb(255 255 255 / 6%);
      border: 1px solid rgb(255 255 255 / 10%);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .pdf-button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: translateY(-1px);
    }

    .add-submission-btn {
      background: linear-gradient(180deg,
          var(--accent),
          var(--accent-strong));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        filter 0.18s ease;
      height: fit-content;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgb(47 106 233 / 28%);
      width: 100%;
    }

    .add-submission-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .material-viewer img {
      max-width: 100%;
      border-radius: 16px;
    }

    .doc-image {
      max-width: 100%;
      max-height: min(70vh, 700px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      cursor: zoom-in;
      display: block;
      margin: 0 auto;
    }

    .image-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1100;
      background: rgb(0 0 0 / 82%);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 32px;
      cursor: zoom-out;
    }

    .image-lightbox.show {
      display: flex;
    }

    .image-lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgb(0 0 0 / 45%);
    }

    .image-lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgb(255 255 255 / 8%);
      border: 1px solid rgb(255 255 255 / 14%);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .image-lightbox-close:hover {
      background: rgb(255 255 255 / 16%);
    }

    embed {
      width: 100%;
      height: min(78vh, 900px);
      border: 0;
      border-radius: 16px;
      overflow: hidden;
    }

    .pdf-container:fullscreen embed {
      height: calc(100vh - 70px);
    }

    iframe {
      width: 100%;
      height: min(78vh, 900px);
      border: 0;
      border-radius: 16px;
      background: white;
    }

    video {
      width: 100%;
      max-height: 680px;
      border-radius: 16px;
      background: #000;
    }

    @media print {
      @page {
        margin: 1.5cm;
      }

      body,
      .app-page {
        background: #fff !important;
        color: #000 !important;
      }

      .page {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .header .home-btn,
      .header .back-btn,
      .header .settings-link,
      #assignments-search,
      .submission-modal-overlay,
      .due-date-countdown,
      .add-submission-btn,
      .attachment-download,
      .attachments-toolbar,
      .pdf-controls {
        display: none !important;
      }

      .header h2 {
        padding: 0;
        color: #000;
      }

      .panels,
      .description,
      .submissions-container,
      .attachments-container {
        border: 1px solid #bbb;
        box-shadow: none;
        background: #fff;
        color: #000;
        break-inside: avoid;
      }

      iframe,
      video {
        display: none;
      }

      a {
        color: #000;
        text-decoration: underline;
      }
    }

    .comment {
      display: none;
    }

    .submission-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgb(0 0 0 / 55%);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .submission-modal {
      width: min(880px, 100%);
      max-height: min(92vh, 920px);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgb(0 0 0 / 45%);
      overflow: hidden;
    }

    .submission-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .submission-modal-header h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 750;
      color: var(--text-strong);
    }

    .submission-modal-close {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgb(255 255 255 / 6%);
      border: 1px solid rgb(255 255 255 / 10%);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .submission-modal-close:hover {
      background: rgb(255 255 255 / 14%);
    }

    .submission-modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .submission-modal-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--soft-border);
      flex: 0 0 auto;
    }

    .submission-tab-btn {
      appearance: none;
      background: transparent;
      border: none;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted-panel);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transform: translateY(1px);
      transition:
        color 0.18s ease,
        border-color 0.18s ease;
    }

    .submission-tab-btn:hover {
      color: var(--text);
    }

    .submission-tab-btn.active {
      color: var(--text-strong);
      border-bottom-color: var(--link);
    }

    .submission-modal-panels {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    .submission-tab-panel {
      display: none;
      flex-direction: column;
      gap: 16px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .submission-tab-panel.active {
      display: flex;
    }

    .submission-modal-section {
      display: grid;
      gap: 8px;
    }

    .submission-modal-section.submission-editor-section {
      flex: 1 1 auto;
      min-height: 320px;
    }

    .submission-modal-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted-panel);
    }

    .submission-editor-wrapper {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 280px;
      border: 1px solid var(--soft-border);
      border-radius: 10px;
      overflow: visible;
      background: rgb(0 0 0 / 22%);
    }

    .submission-editor-quill {
      flex: 1 1 auto;
      min-height: 0;
      color: var(--text);
    }

    .submission-editor-wrapper .ql-toolbar.ql-snow {
      background: var(--soft-panel);
      border: none;
      border-bottom: 1px solid var(--soft-border);
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .ql-toolbar.ql-snow .ql-formats button,
    .ql-toolbar.ql-snow .ql-picker-label {
      position: relative;
    }

    .ql-toolbar.ql-snow [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgb(15 23 42 / 92%);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 4px 9px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 6px 16px rgb(0 0 0 / 35%);
    }

    .ql-toolbar.ql-snow [data-tooltip]:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-2px);
    }

    .submission-editor-wrapper .ql-container.ql-snow {
      border: none;
      font-size: 0.98rem;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      overflow: hidden;
    }

    .submission-editor-wrapper .ql-tooltip {
      z-index: 20;
    }

    .submission-editor-wrapper .ql-editor {
      min-height: 280px;
      color: var(--text);
    }

    .submission-editor-wrapper .ql-editor.ql-blank::before {
      color: var(--muted-panel);
      font-style: normal;
    }

    .submission-editor-wrapper .ql-snow .ql-stroke {
      stroke: var(--text);
    }

    .submission-editor-wrapper .ql-snow .ql-fill {
      fill: var(--text);
    }

    .submission-editor-wrapper .ql-snow .ql-picker {
      color: var(--text);
    }

    .submission-editor-wrapper .ql-snow .ql-picker-options {
      background: var(--surface-strong, var(--surface));

    function getRelativeDueLabel(dueDate) {
      if (dueDate.getTime() <= Date.now()) {
        return ""
      }

      // Compare calendar days (local time), not raw 24h differences
      const startOfDay = (d) =>
        new Date(d.getFullYear(), d.getMonth(), d.getDate())
      const dayDiff = Math.round(
        (startOfDay(dueDate) - startOfDay(new Date())) / 86400000,
      )
      const weekday = dueDate.toLocaleDateString(undefined, {
        weekday: "long",
      })

      if (dayDiff === 0) {
        return "Today"
      }
      if (dayDiff === 1) {
        return "Tomorrow"
      }
      if (dayDiff >= 2 && dayDiff <= 6) {
        return weekday
      }
      if (dayDiff >= 7 && dayDiff <= 13) {
        return `Next ${weekday}`
      }

      return ""
    }

    function formatMilliseconds(milliseconds) {
      const totalSeconds = Math.floor(milliseconds / 1000)
      const days = Math.floor(totalSeconds / 86400)
      const hours = Math.floor(totalSeconds % 86400 / 3600)
      const minutes = Math.floor(totalSeconds % 3600 / 60)
      const seconds = totalSeconds % 60

      const durationParts = []

      if (days) {
        durationParts.push(`${days}d`)
        durationParts.push(`${String(hours).padStart(2, "0")}h`)
        durationParts.push(`${String(minutes).padStart(2, "0")}m`)
        durationParts.push(`${String(seconds).padStart(2, "0")}s`)
      }
      else if (hours) {
        durationParts.push(`${hours}h`)
        durationParts.push(`${String(minutes).padStart(2, "0")}m`)
        durationParts.push(`${String(seconds).padStart(2, "0")}s`)
      }
      else if (minutes) {
        durationParts.push(`${minutes}m`)
        durationParts.push(`${String(seconds).padStart(2, "0")}s`)
      }
      else if (seconds) {
        durationParts.push(`${String(seconds).padStart(2, "0")}s`)
      }

      return durationParts.join(" ") || "0s"
    }

    async function loadMaterial() {
      const response = await fetchWithRetry(
        `/api/section/${sectionId}/folder/${folderId}/material/${materialId}`,
      )
      const materialResponse = await response.json()
      const material = materialResponse.material

      const textarea = document.createElement("textarea")

      textarea.innerHTML = material.title
      textarea.innerHTML = textarea.value

      document.getElementById("title").textContent = textarea.value

      const materialType = material.type
      const materialViewer = document.getElementById("material-viewer")
      materialViewer.innerHTML = ""

      if (materialType === "document") {
        const documentType = material.documentType

        if (documentType === "file") {
          displayFile(material, materialViewer)
        }
        else if (documentType === "link") {
          const linkUrl = material.url
          const documentLink = document.createElement("a")
          documentLink.href = linkUrl
          documentLink.textContent = linkUrl
          materialViewer.appendChild(documentLink)

          const videoViewer = createVideoViewer(linkUrl)

          if (videoViewer) {
            materialViewer.appendChild(videoViewer)
          }
          else {
            const iframe = document.createElement("iframe")
            iframe.src = linkUrl
            iframe.loading = "lazy"
            iframe.allow = "fullscreen"
            materialViewer.appendChild(iframe)
          }
        }
        else if (documentType === "video") {
          const linkUrl = material.url
          const documentLink = document.createElement("a")
          documentLink.href = linkUrl
          documentLink.textContent = linkUrl
          documentLink.target = "_blank"
          documentLink.rel = "noopener noreferrer"
          materialViewer.appendChild(documentLink)

          const videoViewer = createVideoViewer(linkUrl)

          if (videoViewer) {
            materialViewer.appendChild(videoViewer)
          }
        }
      }
      else if (materialType === "page") {
        materialViewer.innerHTML = material.description
      }
      else if (materialType === "assignment" || materialType === "discussion") {
        const assignmentTemplate = document.getElementById(
          "assignment-template",
        )
        const assignmentClone = assignmentTemplate.content.cloneNode(true)

        assignmentClone.querySelector(".category").textContent = `Category: ${material.category}`

        const gradeScoreElement = assignmentClone.querySelector(".grade-score")
        let grade

        if (material.grade) {
          grade = material.grade
        }

        gradeScoreElement.textContent = `Grade: ${material.gradeException ? `${material.gradeException} ` : ""}${grade ? grade : "_"}${material.maxPoints ? `/${material.maxPoints}` : ""}`

        const gradeComment = assignmentClone.querySelector(".grade-comment")
        if (material.comment) {
          gradeComment.textContent = `Comment: ${material.comment}`
        }
        else {
          gradeComment.style.display = "none"
        }

        const descriptionElement = assignmentClone.querySelector(
          ".description-content",
        )
        if (material.description) {
          descriptionElement.innerHTML = linkify(
            stripInlineColors(material.description),
          )
        }
        else {
          descriptionElement.textContent = "No description"
        }

        const attachmentListContainer = assignmentClone.querySelector(
          ".attachments-container",
        )
        if (material.attachments?.length) {
          attachmentListContainer.classList.add("show")
          const attachmentsList = assignmentClone.querySelector(".attachments")
          const fileAttachmentUrls = []

          for (const attachment of material.attachments) {
            const attachmentContainer = document.createElement("div")
            attachmentContainer.className = "attachment-container"

            if (attachment.type === "link") {
              const linkElement = document.createElement("a")
              linkElement.className = "attachment-link"
              linkElement.href = attachment.url
              linkElement.textContent = attachment.title
              linkElement.target = "_blank"
              linkElement.rel = "noopener noreferrer"
              attachmentContainer.appendChild(linkElement)
            }
            else if (attachment.type === "file") {
              fileAttachmentUrls.push(attachment.url)
              const attachmentRow = document.createElement("div")
              attachmentRow.className = "attachment-row"

              const fileElement = document.createElement("a")
              fileElement.className = "attachment-file"
              fileElement.href = "/api/file?url=" + encodeURIComponent(attachment.url)
              fileElement.textContent = attachment.title

              const downloadButton = document.createElement("a")
              downloadButton.className = "attachment-download"
              downloadButton.href = attachment.url
              downloadButton.download = ""
              downloadButton.title = "Download"

              attachmentRow.appendChild(fileElement)
              attachmentRow.appendChild(downloadButton)
              attachmentContainer.appendChild(attachmentRow)

              const separator = document.createElement("div")
              separator.className = "attachment-separator"
              attachmentContainer.appendChild(separator)

              displayFile(
                {
                  type: "file",
                  fileUrl: attachment.url,
                  extension: attachment.extension,
                },
                attachmentContainer,
              )
            }

            attachmentsList.appendChild(attachmentContainer)
          }

          if (fileAttachmentUrls.length > 0) {
            const toolbar = document.createElement("div")
            toolbar.className = "attachments-toolbar"

            const zipButton = document.createElement("button")
            zipButton.type = "button"
            zipButton.className = "attachments-zip-button"
            zipButton.textContent = "Download all files as ZIP"
            zipButton.addEventListener("click", () => {
              const query = fileAttachmentUrls
                .map((url) => `url=${encodeURIComponent(url)}`)
                .join("&")
              window.location.href = `/api/attachments.zip?${query}`
            })

            toolbar.appendChild(zipButton)
            attachmentListContainer.appendChild(toolbar)
          }
        }

        const dueDate = new Date(material.dueDate)
        const relativeLabel = getRelativeDueLabel(dueDate)
        assignmentClone.querySelector(".due-date-text").textContent = dueDate.getTime() === 0 ? "Date: not set" : `Due: ${relativeLabel ? `${relativeLabel} · ` : ""}${dueDate.toLocaleString()}`

        const countdownElement = assignmentClone.querySelector(
          ".due-date-countdown",
        )
        let countDownInterval

        function updateCountdown() {
          const now = new Date()
          const timeDifference = dueDate - now

          if (timeDifference <= 0) {
            countdownElement.textContent = "Time Left: Time's up!"
            clearInterval(countDownInterval)
            return
          }

          countdownElement.textContent = `Time Left: ${formatMilliseconds(timeDifference)}`
        }

        if (dueDate.getTime()) {
          countDownInterval = setInterval(updateCountdown, 1000)
          updateCountdown()
          window.addEventListener("beforeunload", () => {
            clearInterval(countDownInterval)
          })
        }
        else {
          countdownElement.style.display = "none"
        }

        const assignmentType = material.assignmentType
        if (assignmentType === "document") {
          const documentUrl = material.documentUrl
          const documentIframe = document.createElement("iframe")
          documentIframe.src = documentUrl
          assignmentClone.appendChild(documentIframe)
        }
        else if (assignmentType === "discussion") {
          assignmentClone.querySelector(".submissions-row").style.display = "none"
        }
        else if (assignmentType === "default") {
          const addSubmissionBtn = assignmentClone.querySelector(
            ".add-submission-btn",
          )
          addSubmissionBtn.addEventListener("click", () => {
            openSubmissionModal(material.id)
          })

          const submissionsElement = assignmentClone.querySelector(".submissions")
          const submissions = material.submissions

          const submissionTemplate = document.getElementById(
            "submission-template",
          )
          const fileTemplate = document.getElementById("file-template")
          const htmlTemplate = document.getElementById("html-template")

          let addedAssignment = false

          if (submissions?.length) {
            submissions.sort(
              (submissionOne, submissionTwo) =>
                submissionOne.id - submissionTwo.id,
            )

            const results = await Promise.all(
              submissions.map(async (submission, index) => {
                if (submission.type === "draft") {
                  return {
                    type: "draft",
                    index,
                    html: submission.draft_html,
                    late: submission.late,
                  }
                }

                addedAssignment = true

                const fileUrl = submission.fileUrl

                const fileResponse = await fetchWithRetry(
                  `/api/file?url=${encodeURIComponent(fileUrl)}`,
                )

                let fileName = "file"
                const contentDisposition = fileResponse.headers.get(
                  "Content-Disposition",
                )

                if (contentDisposition) {
                  const match = contentDisposition.match(/filename="?([^"]+)"?/)
                  if (match) {
                    fileName = decodeURIComponent(match[1])
                  }
                }

                if (fileUrl.endsWith(".html")) {
                  const html = await fileResponse.text()
                  return {
                    type: "html",
                    index,
                    fileUrl,
                    html,
                    late: submission.late,
                  }
                }

                const blob = await fileResponse.blob()
                const objectUrl = URL.createObjectURL(blob)

                return {
                  type: "file",
                  index,
                  fileUrl,
                  fileName,
                  objectUrl,
                  late: submission.late,
                }
              }),
            )

            const renderedResults = results.filter(
              (result) => result.type !== "draft",
            )

            renderedResults.forEach((result, index) => {
              const submissionClone = submissionTemplate.content.cloneNode(true)

              const link = submissionClone.querySelector(".submission-link")
              const lateText = submissionClone.querySelector(".late-text")
              const content = submissionClone.querySelector(
                ".submission-content",
              )

              link.textContent = `Submission ${index + 1}`
              link.href = result.fileUrl

              if (result.late) {
                lateText.textContent = "LATE"
                lateText.classList.add("show")
              }

              if (result.type === "html") {
                const htmlClone = htmlTemplate.content.cloneNode(true)
                const viewer = htmlClone.querySelector(".submission-viewer")
                viewer.innerHTML = result.html
                content.appendChild(htmlClone)
              }
              else {
                const fileClone = fileTemplate.content.cloneNode(true)
                const nameLabel = fileClone.querySelector(".file-name")
                const downloadButton = fileClone.querySelector(".download-btn")

                nameLabel.textContent = result.fileName
                downloadButton.href = result.objectUrl
                downloadButton.download = result.fileName

                content.appendChild(fileClone)
              }

              submissionsElement.appendChild(submissionClone)
            })
          }
          else if (!material.canBeTurnedIn) {
            assignmentClone.querySelector(".submissions-row").style.display = "none"
          }
          if (!addedAssignment) {
            assignmentClone.querySelector(
              ".submissions-container",
            ).style.display = "none"
          }
        }

        materialViewer.appendChild(assignmentClone)
      }
    }

    loadMaterial()

    function createCaptionedVideo(videoSrc, captionSourceUrl) {
      const wrapper = document.createElement("div")

      const video = document.createElement("video")
      video.src = videoSrc
      video.controls = true
      video.playsInline = true
      video.preload = "metadata"
      video.style.maxWidth = "100%"

      const button = document.createElement("button")
      button.type = "button"
      button.className = "material-action"
      button.textContent = "Generate captions"
      button.style.marginTop = "8px"

      const progressWrap = document.createElement("div")
      progressWrap.style.cssText = "display:none; margin-top:8px;"
      const bar = document.createElement("progress")
      bar.max = 100
      bar.value = 0
      bar.style.width = "100%"
      const label = document.createElement("div")
      label.style.cssText = "font-size:0.85rem; margin-top:4px;"
      progressWrap.append(bar, label)

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const encodedUrl = encodeURIComponent(captionSourceUrl)

      button.addEventListener("click", async () => {
        button.style.display = "none"
        progressWrap.style.display = "block"
        label.textContent = "Starting…"

        try {
          const startResp = await fetch(`/captions/start?url=${encodedUrl}`)
          if (!startResp.ok) {
            throw new Error(`HTTP ${startResp.status}`)
          }
          const started = await startResp.json()
          let state = started

          while (state.status !== "done") {
            if (state.status === "error") {
              throw new Error(state.error || "Failed")
            }

            const pct = Math.round(state.progress * 100)
            bar.value = pct
            label.textContent = state.status === "downloading" ? `Downloading video… ${pct}%` : `Transcribing… ${pct}%`

            await sleep(1000)
            const statusResp = await fetch(
              `/captions/status?job=${encodeURIComponent(started.job)}`,
            )
            if (!statusResp.ok) {
              throw new Error(`HTTP ${statusResp.status}`)
            }
            state = await statusResp.json()
          }

          bar.value = 100
          label.textContent = "Loading captions…"

          const resp = await fetch(`/captions?url=${encodedUrl}`)
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`)
          }
          const vttBlob = new Blob([await resp.text()], { type: "text/vtt" })

          const track = document.createElement("track")
          track.kind = "captions"
          track.label = "English (auto)"
          track.srclang = "en"
          track.src = URL.createObjectURL(vttBlob)
          track.default = true
          video.appendChild(track)
          track.track.mode = "showing"

          progressWrap.remove()
          button.remove()
        }
        catch (err) {
          console.error("Caption generation failed:", err)
          progressWrap.style.display = "none"
          button.style.display = ""
          button.textContent = "Captions failed. Try again"
        }
      })

      wrapper.append(video, button, progressWrap)
      return wrapper
    }

    function createVideoViewer(videoUrl) {
      let parsedUrl
      try {
        parsedUrl = new URL(videoUrl, window.location.href)
      }
      catch {
        return null
      }

      const hostname = parsedUrl.hostname.toLowerCase()
      let embedUrl = null

      if (hostname === "youtu.be") {
        embedUrl = `https://www.youtube.com/embed/${parsedUrl.pathname.slice(1)}`
      }
      else if (hostname.endsWith("youtube.com")) {
        const videoId = parsedUrl.searchParams.get("v")
        if (videoId) {
          embedUrl = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}`
        }
      }
      else if (
        hostname === "vimeo.com" || hostname.endsWith(".vimeo.com")
      ) {
        const videoId = parsedUrl.pathname.split("/").filter(Boolean).pop()
        if (videoId && /^\d+$/.test(videoId)) {
          embedUrl = `https://player.vimeo.com/video/${videoId}`
        }
      }

      if (embedUrl) {
        const iframe = document.createElement("iframe")
        iframe.src = embedUrl
        iframe.loading = "lazy"
        iframe.allow = "autoplay; fullscreen; picture-in-picture"
        iframe.allowFullscreen = true
        iframe.title = "Embedded video"
        return iframe
      }

      if (
        /\.(mp4|webm|ogg)(?:$|[?#])/i.test(
          parsedUrl.pathname + parsedUrl.search,
        )
      ) {
        return createCaptionedVideo(videoUrl, parsedUrl.href)
      }

      return null
    }

    function displayFile(file, fileViewer) {
      const fileUrl = file.fileUrl
      const fileExtension = file.extension?.toLowerCase()

      if (file.type === "link") {
        const videoViewer = createVideoViewer(fileUrl)

        if (videoViewer) {
          fileViewer.appendChild(videoViewer)
        }
        else {
          const documentIframe = document.createElement("iframe")
          documentIframe.src = fileUrl
          fileViewer.appendChild(documentIframe)
        }
      }
      else if (
        ["png", "jpg", "jpeg", "gif", "webp"].includes(fileExtension)
      ) {
        const imageSource = `/api/file?url=${encodeURIComponent(fileUrl)}`
        const documentImage = document.createElement("img")
        documentImage.className = "doc-image"
        documentImage.src = imageSource
        documentImage.alt = file.title || ""
        documentImage.addEventListener("click", () =>
          openLightbox(imageSource, documentImage.alt),
        )
        fileViewer.appendChild(documentImage)
      }
      else if (fileExtension === "pdf") {
        const pdfContainer = document.createElement("div")
        pdfContainer.className = "pdf-container"

        const pdfControls = document.createElement("div")
        pdfControls.className = "pdf-controls"

        const pdfUrl = `/api/file?url=${encodeURIComponent(fileUrl)}`

        const openButton = document.createElement("a")
        openButton.className = "pdf-button"
        openButton.href = pdfUrl
        openButton.target = "_blank"
        openButton.rel = "noopener noreferrer"
        openButton.textContent = "↗ Open in new tab"

        const fullscreenButton = document.createElement("button")
        fullscreenButton.className = "pdf-button"
        fullscreenButton.type = "button"
        fullscreenButton.textContent = "⛶ Fullscreen"

        const documentEmbed = document.createElement("embed")
        documentEmbed.src = pdfUrl
        documentEmbed.type = "application/pdf"

        fullscreenButton.addEventListener("click", async () => {
          if (!document.fullscreenElement) {
            await pdfContainer.requestFullscreen()
            fullscreenButton.textContent = "⛶ Exit fullscreen"
          }
          else {
            await document.exitFullscreen()
            fullscreenButton.textContent = "⛶ Fullscreen"
          }
        })

        document.addEventListener("fullscreenchange", () => {
          if (!document.fullscreenElement) {
            fullscreenButton.textContent = "⛶ Fullscreen"
          }
        })

        pdfControls.appendChild(openButton)
        pdfControls.appendChild(fullscreenButton)

        pdfContainer.appendChild(pdfControls)
        pdfContainer.appendChild(documentEmbed)
        fileViewer.appendChild(pdfContainer)
      }
      else if (["mp4", "webm", "ogg"].includes(fileExtension)) {
        fileViewer.appendChild(
          createCaptionedVideo(
            `/api/file?url=${encodeURIComponent(fileUrl)}`,
            fileUrl,
          ),
        )
      }
      else {
        const documentIframe = document.createElement("iframe")
        documentIframe.src = `/api/file?url=${encodeURIComponent(fileUrl)}`
        fileViewer.appendChild(documentIframe)
      }
    }

    function linkify(html) {
      const container = document.createElement("div")
      container.innerHTML = html

      const urlRegex = /https?:\/\/[^\s<>"']+/g

      const walker = document.createTreeWalker(
        container,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node) {
            return node.parentElement?.closest("a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
          },
        },
      )

      const textNodes = []
      let currentNode
      while (currentNode = walker.nextNode()) {
        textNodes.push(currentNode)
      }

      for (const textNode of textNodes) {
        const text = textNode.nodeValue
        if (!urlRegex.test(text)) {
          continue
        }

        urlRegex.lastIndex = 0

        const fragment = document.createDocumentFragment()
        let lastIndex = 0
        let match

        while (match = urlRegex.exec(text)) {
          const rawUrl = match[0]
          const cleanUrl = rawUrl.replace(/[),.]+$/, "")
          const trailingUrlText = rawUrl.slice(cleanUrl.length)

          if (match.index > lastIndex) {
            fragment.appendChild(
              document.createTextNode(text.slice(lastIndex, match.index)),
            )
          }

          const linkElement = document.createElement("a")
          linkElement.href = cleanUrl
          linkElement.target = "_blank"
          linkElement.rel = "noopener noreferrer"
          linkElement.textContent = cleanUrl
          fragment.appendChild(linkElement)

          if (trailingUrlText) {
            fragment.appendChild(document.createTextNode(trailingUrlText))
          }

          lastIndex = match.index + rawUrl.length
        }

        if (lastIndex < text.length) {
          fragment.appendChild(
            document.createTextNode(text.slice(lastIndex)),
          )
        }

        textNode.replaceWith(fragment)
      }

      return container.innerHTML
    }

    let submissionLibsPromise = null

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) {
          resolve()
          return
        }
        const script = document.createElement("script")
        script.src = src
        script.onload = () => resolve()
        script.onerror = () =>
          reject(new Error(`Failed to load script: ${src}`))
        document.head.appendChild(script)
      })
    }

    function loadStyleOnce(href) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`link[href="${href}"]`)) {
          resolve()
          return
        }
        const link = document.createElement("link")
        link.rel = "stylesheet"
        link.href = href
        link.onload = () => resolve()
        link.onerror = () =>
          reject(new Error(`Failed to load stylesheet: ${href}`))
        document.head.appendChild(link)
      })
    }

    function ensureSubmissionLibsLoaded() {
      if (!submissionLibsPromise) {
        submissionLibsPromise = Promise.all([
          loadStyleOnce(
            "https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css",
          ),
          loadScriptOnce(
            "https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js",
          ),
          loadScriptOnce(
            "https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js",
          ),
        ])
      }
      return submissionLibsPromise
    }

    let googleDriveLibsPromise = null
    let googleTokenClient = null
    let googleAccessToken = null

    function ensureGoogleDriveLoaded() {
      if (!googleDriveLibsPromise) {
        googleDriveLibsPromise = Promise.all([
          loadScriptOnce("https://accounts.google.com/gsi/client"),
          loadScriptOnce("https://apis.google.com/js/api.js"),
        ]).then(
          () =>
            new Promise((resolve, reject) => {
              gapi.load("picker", {
                callback: resolve,
                onerror: () =>
                  reject(new Error("Failed to load Google Picker")),
              })
            }),
        )
      }
      return googleDriveLibsPromise
    }

    function requestGoogleAccessToken() {
      return new Promise((resolve, reject) => {
        if (!googleTokenClient) {
          googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: "https://www.googleapis.com/auth/drive.file",
            callback: () => { },
          })
        }

        googleTokenClient.callback = (tokenResponse) => {
          if (tokenResponse.error) {
            reject(new Error(tokenResponse.error))
            return
          }
          googleAccessToken = tokenResponse.access_token
          resolve(googleAccessToken)
        }
        googleTokenClient.error_callback = (err) =>
          reject(new Error(err?.type || "Google sign-in was cancelled"))

        googleTokenClient.requestAccessToken({
          prompt: googleAccessToken ? "" : "consent",
        })
      })
    }

    function showGoogleDrivePicker(accessToken) {
      return new Promise((resolve, reject) => {
        try {
          const picker = new google.picker.PickerBuilder()
            .addView(google.picker.ViewId.DOCS)
            .setOAuthToken(accessToken)
            .setDeveloperKey(GOOGLE_API_KEY)
            .setCallback((data) => {
              if (data.action === google.picker.Action.PICKED) {
                resolve(data.docs || [])
              }
              else if (data.action === google.picker.Action.CANCEL) {
                resolve([])
              }
            })
            .build()
          picker.setVisible(true)
        }
        catch (err) {
          reject(err)
        }
      })
    }

    const GOOGLE_EXPORT_MIME_TYPES = {
      "application/vnd.google-apps.document":
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      "application/vnd.google-apps.spreadsheet":
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      "application/vnd.google-apps.presentation":
        "application/vnd.openxmlformats-officedocument.presentationml.presentation",
      "application/vnd.google-apps.drawing": "image/png",
    }

    const GOOGLE_EXPORT_EXTENSIONS = {
      "application/vnd.google-apps.document": ".docx",
      "application/vnd.google-apps.spreadsheet": ".xlsx",
      "application/vnd.google-apps.presentation": ".pptx",
      "application/vnd.google-apps.drawing": ".png",
    }

    async function downloadDriveFile(doc, accessToken) {
      const exportMimeType = GOOGLE_EXPORT_MIME_TYPES[doc.mimeType]

      const downloadUrl = exportMimeType ? `https://www.googleapis.com/drive/v3/files/${doc.id}/export?mimeType=${encodeURIComponent(exportMimeType)}` : `https://www.googleapis.com/drive/v3/files/${doc.id}?alt=media`

      const response = await fetchWithRetry(downloadUrl, {
        headers: { Authorization: `Bearer ${accessToken}` },
      })

      if (!response.ok) {
        throw new Error(
          `Failed to download "${doc.name}" from Drive (${response.status})`,
        )
      }

      const blob = await response.blob()
      let fileName = doc.name
      const extension = GOOGLE_EXPORT_EXTENSIONS[doc.mimeType]
      if (extension && !fileName.toLowerCase().endsWith(extension)) {
        fileName += extension
      }

      return new File([blob], fileName, { type: blob.type || doc.mimeType })
    }

    async function fetchLatestDraftHtml() {
      try {
        const response = await fetchWithRetry(
          `/api/section/${sectionId}/folder/${folderId}/material/${materialId}`,
        )
        const materialResponse = await response.json()
        const submissions = materialResponse.material?.submissions || []
        const draft = submissions.find(
          (submission) => submission.type === "draft",
        )
        return draft ? { html: draft.draft_html || null, revisionId: draft.id } : null
      }
      catch (err) {
        console.error("Failed to refresh draft:", err)
        return null
      }
    }

    const QUILL_TOOLBAR_TOOLTIPS = [
      [".ql-bold", "Bold"],
      [".ql-italic", "Italic"],
      [".ql-underline", "Underline"],
      [".ql-strike", "Strikethrough"],
      [".ql-header[value=\"1\"]", "Heading 1"],
      [".ql-header[value=\"2\"]", "Heading 2"],
      [".ql-list[value=\"ordered\"]", "Numbered list"],
      [".ql-list[value=\"bullet\"]", "Bulleted list"],
      [".ql-blockquote", "Blockquote"],
      [".ql-code-block", "Code block"],
      [".ql-link", "Insert link"],
      [".ql-clean", "Clear formatting"],
    ]

    function addToolbarTooltips(root) {
      const toolbar = root.querySelector(".ql-toolbar")
      if (!toolbar) {
        return
      }
      QUILL_TOOLBAR_TOOLTIPS.forEach(([selector, label]) => {
        toolbar.querySelectorAll(selector).forEach((el) => {
          el.setAttribute("data-tooltip", label)
          el.setAttribute("aria-label", label)
        })
      })
    }

    function openSubmissionModal(assignmentId) {
      const modalTemplate = document.getElementById(
        "submission-modal-template",
      )
      const modalFragment = modalTemplate.content.cloneNode(true)

      const overlay = modalFragment.querySelector(
        ".submission-modal-overlay",
      )
      const closeButton = modalFragment.querySelector(
        ".submission-modal-close",
      )
      const submitButton = modalFragment.querySelector(
        ".submission-modal-submit",
      )
      const fileInput = modalFragment.querySelector(".submission-file-input")
      const driveButton = modalFragment.querySelector(
        ".submission-drive-btn",
      )
      const fileListElement = modalFragment.querySelector(
        ".submission-file-list",
      )
      const errorElement = modalFragment.querySelector(
        ".submission-modal-error",
      )
      const commentInput = modalFragment.querySelector(
        ".submission-comment-input",
      )
      const editorElement = modalFragment.querySelector(
        ".submission-editor-quill",
      )
      const editorWrapper = modalFragment.querySelector(
        ".submission-editor-wrapper",
      )
      const tabButtons = modalFragment.querySelectorAll(
        ".submission-tab-btn",
      )
      const tabPanels = modalFragment.querySelectorAll(
        ".submission-tab-panel",
      )

      document.body.appendChild(overlay)

      let selectedFiles = []
      let quill = null
      let activeTab = "text"
      let draftRevisionId = null

      function hasText() {
        return quill ? quill.getText().trim().length > 0 : false
      }

      function hasFiles() {
        return selectedFiles.length > 0
      }

      function setActiveTab(tab) {
        activeTab = tab
        tabButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.tab === tab)
        })
        tabPanels.forEach((panel) => {
          panel.classList.toggle("active", panel.dataset.tabPanel === tab)
        })
        errorElement.textContent = ""
      }

      tabButtons.forEach((btn) => {
        btn.addEventListener("click", () => setActiveTab(btn.dataset.tab))
      })

      async function saveDraftIfNeeded() {
        if (!hasText()) {
          if (!draftRevisionId) {
            return
          }

          const formData = new FormData()
          formData.append("assignment_id", assignmentId)
          formData.append("revision_id", draftRevisionId)
          await fetchWithRetry("/delete_draft", {
            method: "POST",
            body: formData,
          })
          draftRevisionId = null
          return
        }
        try {
          const formData = new FormData()
          formData.append("assignment_id", assignmentId)
          formData.append("html", quill.root.innerHTML)
          await fetchWithRetry("/save_draft", {
            method: "POST",
            body: formData,
          })
        }
        catch (err) {
          console.error("Failed to save draft:", err)
        }
      }

      function saveDraftOnUnload() {
        if (!hasText()) {
          return
        }
        const formData = new FormData()
        formData.append("assignment_id", assignmentId)
        formData.append("html", quill.root.innerHTML)
        navigator.sendBeacon("/save_draft", formData)
      }

      window.addEventListener("beforeunload", saveDraftOnUnload)

      async function closeModal() {
        window.removeEventListener("beforeunload", saveDraftOnUnload)
        await saveDraftIfNeeded()
        revokeFilePreviews()
        quill = null
        overlay.remove()
      }

      closeButton.addEventListener("click", () => {
        closeButton.disabled = true
        closeModal()
      })

      function isImageFile(file) {
        return !!file.type && file.type.startsWith("image/")
      }

      function fileExtensionLabel(fileName) {
        const match = /\.([a-z0-9]+)$/i.exec(fileName || "")
        return match ? match[1].toUpperCase() : "FILE"
      }

      function revokeFilePreviews() {
        selectedFiles.forEach((file) => {
          if (file._previewUrl) {
            URL.revokeObjectURL(file._previewUrl)
            file._previewUrl = null
          }
        })
      }

      function renderFileList() {
        fileListElement.innerHTML = ""
        selectedFiles.forEach((file, index) => {
          const item = document.createElement("div")
          item.className = "submission-file-item"

          if (isImageFile(file)) {
            if (!file._previewUrl) {
              file._previewUrl = URL.createObjectURL(file)
            }
            const thumb = document.createElement("img")
            thumb.className = "submission-file-thumb"
            thumb.src = file._previewUrl
            thumb.alt = file.name
            thumb.addEventListener("click", () =>
              openLightbox(file._previewUrl, file.name),
            )
            item.appendChild(thumb)
          }
          else {
            const icon = document.createElement("span")
            icon.className = "submission-file-icon"
            icon.textContent = fileExtensionLabel(file.name)
            item.appendChild(icon)
          }

          const name = document.createElement("span")
          name.className = "submission-file-name"
          name.textContent = file.name

          const removeButton = document.createElement("button")
          removeButton.type = "button"
          removeButton.className = "submission-file-remove"
          removeButton.textContent = "\u2715"
          removeButton.title = "Remove"
          removeButton.addEventListener("click", () => {
            if (file._previewUrl) {
              URL.revokeObjectURL(file._previewUrl)
            }
            selectedFiles.splice(index, 1)
            renderFileList()
          })

          item.appendChild(name)
          item.appendChild(removeButton)
          fileListElement.appendChild(item)
        })
      }

      fileInput.addEventListener("change", () => {
        selectedFiles = selectedFiles.concat(Array.from(fileInput.files))
        fileInput.value = ""
        renderFileList()
      })

      const dropzone = overlay.querySelector(".submission-dropzone");

      ["dragenter", "dragover"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault()
          event.stopPropagation()
          dropzone.classList.add("drag-over")
        })
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault()
          event.stopPropagation()
          if (
            eventName === "dragleave" && dropzone.contains(event.relatedTarget)
          ) {
            return
          }
          dropzone.classList.remove("drag-over")
        })
      })

      dropzone.addEventListener("drop", (event) => {
        const droppedFiles = Array.from(event.dataTransfer?.files || [])
        if (droppedFiles.length) {
          selectedFiles = selectedFiles.concat(droppedFiles)
          renderFileList()
        }
      })

      driveButton.addEventListener("click", async () => {
        errorElement.textContent = ""
        driveButton.disabled = true
        const originalLabel = driveButton.textContent
        driveButton.textContent = "Connecting to Google Drive..."

        try {
          await ensureGoogleDriveLoaded()
          const accessToken = await requestGoogleAccessToken()
          const docs = await showGoogleDrivePicker(accessToken)

          if (docs.length) {
            driveButton.textContent = "Downloading from Drive..."
            const downloadedFiles = await Promise.all(
              docs.map((doc) => downloadDriveFile(doc, accessToken)),
            )
            selectedFiles = selectedFiles.concat(downloadedFiles)
            renderFileList()
          }
        }
        catch (err) {
          console.error("Google Drive picker failed:", err)
          errorElement.textContent = "Couldn't get those files from Google Drive."
        }
        finally {
          driveButton.disabled = false
          driveButton.textContent = originalLabel
        }
      })

      const draftPromise = fetchLatestDraftHtml()

      ensureSubmissionLibsLoaded()
        .then(() => {
          quill = new Quill(editorElement, {
            theme: "snow",
            placeholder: "Checking for saved draft...",
            bounds: editorWrapper,
            modules: {
              toolbar: [
                ["bold", "italic", "underline", "strike"],
                [{ header: 1 }, { header: 2 }],
                [{ list: "ordered" }, { list: "bullet" }],
                ["blockquote", "code-block", "link"],
                ["clean"],
              ],
            },
          })

          addToolbarTooltips(editorWrapper)

          return draftPromise
        })
        .then((draft) => {
          quill.root.dataset.placeholder = "Write your submission here..."
          if (draft) {
            draftRevisionId = draft.revisionId
            if (draft.html) {
              quill.clipboard.dangerouslyPasteHTML(draft.html)
            }
          }
        })
        .catch(() => {
          if (quill) {
            quill.root.dataset.placeholder = "Write your submission here..."
          }
          errorElement.textContent = "Couldn't load the editor. You can still attach files."
        })

      submitButton.addEventListener("click", async () => {
        errorElement.textContent = ""

        if (activeTab === "text") {
          if (!hasText()) {
            errorElement.textContent = "Write something before submitting."
            return
          }
        }
        else if (!hasFiles()) {
          errorElement.textContent = "Attach at least one file before submitting."
          return
        }

        submitButton.disabled = true
        submitButton.textContent = "Submitting..."

        try {
          const formData = new FormData()
          formData.append("assignment_id", assignmentId)
          formData.append("draft_revision_id", draftRevisionId)

          if (activeTab === "text") {
            const rawHtml = quill.root.innerHTML
            const cleanHtml = typeof DOMPurify !== "undefined" ? DOMPurify.sanitize(rawHtml) : rawHtml
            formData.append("html", cleanHtml)
          }
          else {
            if (commentInput.value.trim()) {
              formData.append("comment", commentInput.value.trim())
            }
            selectedFiles.forEach((file) => {
              formData.append("files", file, file.name)
            })
          }

          const response = await fetchWithRetry("/submit_assignment", {
            method: "POST",
            body: formData,
          })

          const result = await response.json()

          if (!response.ok || result.status !== "ok") {
            throw new Error(result.message || "Submission failed.")
          }

          window.removeEventListener("beforeunload", saveDraftOnUnload)
          revokeFilePreviews()
          quill = null
          overlay.remove()
          await loadMaterial()
        }
        catch (err) {
          errorElement.textContent = err.message || "Something went wrong while submitting."
          submitButton.disabled = false
          submitButton.textContent = "Submit"
        }
      })
    }

    function stripInlineColors(html) {
      const container = document.createElement("div")
      container.innerHTML = html
      container.querySelectorAll("[style]").forEach((element) => {
        element.style.removeProperty("color")
        element.style.removeProperty("background-color")
      })
      return container.innerHTML
    }
  </script>
