<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/logo.svg" />
  <title>Login</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="/app.js"></script>
  <script src="/back.js"></script>

  <style>
    .login-container {
      width: min(100%, 420px);
      padding: 28px 24px 22px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
      color: var(--text-strong);
      font-size: clamp(1.8rem, 2vw, 2.1rem);
      font-weight: 700;
    }

    form {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgb(148 163 184 / 8%);
      color: var(--text);
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
      background: rgb(148 163 184 / 9%);
    }

    button {
      width: 100%;
      margin-top: 4px;
      padding: 12px 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(180deg,
          var(--accent),
          var(--accent-strong));
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        filter 0.18s ease,
        box-shadow 0.18s ease;
      box-shadow: 0 10px 24px rgb(47 106 233 / 32%);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .message {
      margin-top: 14px;
      font-size: 0.82rem;
      text-align: center;
      color: var(--muted);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(40%);
      transform: none;
    }

    button:disabled:hover {
      filter: grayscale(40%);
      transform: none;
    }

    .message.is-success,
    .message.is-error {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      animation: message-pop 0.35s ease;
    }

    .message.is-success {
      color: #22c55e;
      background: rgb(34 197 94 / 14%);
      border: 1px solid rgb(34 197 94 / 45%);
    }

    .message.is-error {
      color: #ef4444;
      background: rgb(239 68 68 / 12%);
      border: 1px solid rgb(239 68 68 / 40%);
    }

    button.is-success,
    button.is-success:disabled {
      background: linear-gradient(180deg, #22c55e, #16a34a);
      box-shadow: 0 10px 24px rgb(34 197 94 / 35%);
      opacity: 1;
      filter: none;
    }

    @keyframes message-pop {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(4px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .message.is-success,
      .message.is-error {
        animation: none;
      }
    }
  </style>
</head>

<body class="app-page app-page--login">
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required />

      <label>Password</label>
      <input type="password" id="password" required />

      <button type="submit" id="submitButton">Sign In</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById("loginForm")
    const messageTextElement = document.getElementById("message")
    const submitButton = document.getElementById("submitButton")

    function showMessage(text, type) {
      messageTextElement.textContent = text
      messageTextElement.classList.remove("is-success", "is-error")
      if (type) {
        messageTextElement.classList.add(`is-${type}`)
      }
    }

    function resetButton() {
      submitButton.disabled = false
      submitButton.textContent = "Sign In"
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault()

      const email = document.getElementById("email").value
      const password = document.getElementById("password").value

      submitButton.disabled = true
      submitButton.textContent = "Signing in..."
      showMessage("Logging in...", null)

      try {
        const response = await fetchWithRetry("/api/get_token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        })

        const data = await response.json()

        if (data.status === "ok") {
          showMessage("✓ Login successful! Redirecting...", "success")
          submitButton.textContent = "✓ Success"
          submitButton.classList.add("is-success")
          form.querySelectorAll("input").forEach((input) => {
            input.disabled = true
          })

          const nextPath = new URLSearchParams(window.location.search).get(
            "next",
          )
          const destination
            = nextPath && nextPath.startsWith("/") && !nextPath.startsWith("//")
              ? nextPath
              : "/home"

          setTimeout(() => {
            window.location.href = destination
          }, 800)
        }
        else {
          showMessage(`Error: ${data.message}`, "error")
          resetButton()
        }
      }
      catch (error) {
        showMessage(`Network error: ${error.message}`, "error")
        resetButton()
      }
    })
  </script>
</body>

</html>
