<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo.svg" />
    <title>Calendar</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/assignments-search.css" />
    <script src="/app.js"></script>
    <script src="/back.js"></script>
    <style>
        :root {
            --calendar-gap: 8px;
            --calendar-cell-min-height: 116px;
            --calendar-radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        .app-page-dashboard {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .home-toolbar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            width: min(100%, 1500px);
            margin: 0 auto 12px;
            padding: 4px 0;
        }

        .home-toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .home-toolbar-left .back-btn {
            flex: 0 0 auto;
            margin-bottom: 0;
        }

        .home-toolbar-left #assignments-search {
            flex: 0 1 480px;
            min-width: min(100%, 280px);
            width: min(100%, 480px);
        }

        .home-toolbar .search-bar {
            max-width: none;
            margin: 0;
        }

        .page-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            padding: 4px;
        }

        .page-actions .settings-link {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 6px 11px;
            border-radius: 8px;
            text-decoration: none;
        }

        .page-actions .settings-link:hover,
        .page-actions .settings-link:focus-visible {
            background: var(--surface-strong);
        }

        h1,
        h2,
        h3 {
            margin: 0;
        }

        .main-layout {
            flex: 1 1 auto;
            width: min(100%, 1500px);
            margin: 0 auto;
            display: flex;
            flex-direction: row;
            gap: 18px;
            min-width: 0;
            min-height: 0;
        }

        .calendar-section {
            min-height: 0;
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 8px 28px rgb(0 0 0 / 14%);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .calendar-title {
            font-size: clamp(1.3rem, 2vw, 1.65rem);
            line-height: 1.2;
            color: var(--text-strong);
            flex: 0 0 auto;
            width: 15ch;
            white-space: nowrap;
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-strong);
        }

        .calendar-button {
            min-width: 38px;
            min-height: 34px;
            background: transparent;
            border: 0;
            border-radius: 7px;
            color: var(--text-strong);
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            padding: 5px 10px;
            transition:
                background var(--motion-duration) var(--motion-easing),
                color var(--motion-duration) var(--motion-easing);
        }

        .calendar-button:hover,
        .calendar-button:focus-visible {
            color: var(--accent);
            background: rgb(79 140 255 / 12%);
            outline: none;
        }

        .calendar-button:active {
            transform: translateY(1px);
        }

        #today-button {
            min-height: 42px;
            padding-inline: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-strong);
        }

        #today-button:hover,
        #today-button:focus-visible {
            border-color: var(--accent);
        }

        .calendar-export {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
            transition:
                color var(--motion-duration) var(--motion-easing),
                background var(--motion-duration) var(--motion-easing),
                border-color var(--motion-duration) var(--motion-easing);
        }

        .calendar-export:hover,
        .calendar-export:focus-visible {
            color: var(--accent);
            background: rgb(79 140 255 / 10%);
            border-color: var(--accent);
        }

        .loading {
            min-height: 34px;
            display: grid;
            place-items: center;
            margin: 0 0 10px;
            font-size: 0.9rem;
            color: var(--muted);
        }



        .calendar-scroll {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2px;
            scrollbar-gutter: stable;
        }

        .calendar-weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: var(--calendar-gap);
        }

        .calendar-grid {
            flex: 1 0 auto;
            min-height: 384px;
            grid-template-rows: repeat(6, minmax(0, 1fr));
        }


        .calendar-weekdays {
            margin-bottom: var(--calendar-gap);
            padding: 0 3px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }

        .calendar-weekdays>div {
            padding: 4px;
        }

        .calendar-day {
            position: relative;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 9px;
            background: rgb(255 255 255 / 7%);
            border: 1px solid var(--border);
            border-radius: var(--calendar-radius);
            color: var(--text);
            box-shadow: inset 0 1px 0 rgb(255 255 255 / 3%);
            font-size: 0.82rem;
            transition:
                border-color var(--motion-duration) var(--motion-easing),
                background var(--motion-duration) var(--motion-easing);
        }

        .calendar-day::-webkit-scrollbar {
            display: none;
        }

        .calendar-day:hover {
            background: rgb(255 255 255 / 10%);
            border-color: rgb(148 163 184 / 65%);
        }

        .calendar-day-other {
            background: rgb(255 255 255 / 2%);
            border-color: var(--border);
            box-shadow: none;
            opacity: 0.48;
        }

        .calendar-day-today {
            background: rgb(79 140 255 / 9%);
            border-color: var(--accent);
            box-shadow:
                inset 0 0 0 1px rgb(79 140 255 / 18%),
                0 0 0 2px var(--focus-ring);
        }

        .calendar-day-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--text);
            font-weight: 700;
            flex: 0 0 auto;
        }

        .calendar-day-today .calendar-day-number {
            color: white;
            background: var(--accent);
            font-weight: 800;
        }

        .calendar-item {
            display: block;
            margin-top: 4px;
            padding: 5px 7px;
            border-radius: 7px;
            background: rgb(79 140 255 / 15%);
            border-left: 3px solid var(--accent);
            color: var(--text-strong);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
            flex: 0 0 auto;
            transition:
                background var(--motion-duration) var(--motion-easing),
                transform var(--motion-duration) var(--motion-easing);
        }

        .calendar-item:hover,
        .calendar-item:focus-visible {
            background: rgb(79 140 255 / 28%);
            transform: translateX(1px);
            outline: none;
        }

        .calendar-item-overdue {
            background: rgb(248 113 113 / 13%);
            border-left-color: var(--overdue);
        }

        .calendar-item-overdue:hover,
        .calendar-item-overdue:focus-visible {
            background: rgb(248 113 113 / 26%);
        }

        .calendar-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .calendar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .calendar-scroll::-webkit-scrollbar-thumb {
            background: var(--surface-strong);
            border: 2px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        .logout-button {
            background: transparent;
            border: 0;
            border-radius: 8px;
            color: #d93025;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            min-height: 34px;
            padding: 6px 11px;
            transition:
                color var(--motion-duration) var(--motion-easing),
                background var(--motion-duration) var(--motion-easing);
        }

        .logout-button:hover,
        .logout-button:focus-visible {
            color: #b3261e;
            background: rgb(211 48 37 / 10%);
            outline: none;
        }

        .logout-button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        @media (width <=900px) {
            .home-toolbar {
                align-items: stretch;
            }

            .home-toolbar-left {
                flex-wrap: wrap;
            }

            .home-toolbar-left #assignments-search {
                flex: 1 1 200px;
            }

            .page-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media (width <=720px) {
            :root {
                --calendar-gap: 5px;
                --calendar-cell-min-height: 76px;
                --calendar-radius: 10px;
            }

            .calendar-grid {
                min-height: 320px;
            }

            .home-toolbar,
            .main-layout {
                width: 100%;
            }

            .home-toolbar {
                margin-bottom: 10px;
            }

            .page-actions {
                justify-content: stretch;
            }

            .page-actions .settings-link,
            .logout-button {
                flex: 1;
                justify-content: center;
                text-align: center;
            }

            .calendar-section {
                padding: 10px;
                border-radius: 14px;
            }

            .calendar-header {
                gap: 8px;
                margin-bottom: 10px;
            }

            .calendar-title {
                width: auto;
                min-width: 0;
                flex: 1 0 100%;
            }

            .calendar-controls {
                order: 2;
            }

            .calendar-export {
                margin-left: auto;
                order: 2;
            }

            .calendar-day {
                padding: 5px;
                font-size: 0.72rem;
            }

            .calendar-day-number {
                width: 24px;
                height: 24px;
                margin-bottom: 3px;
            }

            .calendar-item {
                padding: 3px 4px;
                border-left-width: 2px;
            }

            .calendar-weekdays {
                font-size: 0.68rem;
            }

            #today-button {
                order: 2;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .calendar-button,
            .calendar-export,
            .calendar-item,
            .calendar-day,
            .logout-button {
                transition: none;
            }

            .calendar-item:active {
                transform: none;
            }
        }
    </style>
</head>

<body class="app-page app-page-dashboard">
    <div class="home-toolbar">
        <div class="home-toolbar-left">
            <a class="back-btn" data-back-button data-back-fallback="/home"></a>
            <div id="assignments-search"></div>
        </div>
        <nav class="page-actions" aria-label="Page actions">
            <a class="settings-link" href="/home">Home</a>
            <a class="settings-link" data-settings-link href="/settings">Settings</a>
            <button type="button" id="logout-button" class="logout-button">
                Log out
            </button>
        </nav>
    </div>
    <div class="main-layout">
        <section class="calendar-section" aria-labelledby="month-title">
            <div class="calendar-header">
                <h2 id="month-title" class="calendar-title"></h2>
                <div class="calendar-controls">
                    <button type="button" id="prev-month" class="calendar-button" aria-label="Previous month">
                        &lt;
                    </button>
                    <button type="button" id="next-month" class="calendar-button" aria-label="Next month">
                        &gt;
                    </button>
                </div>
                <button type="button" id="today-button" class="calendar-button">
                    Today
                </button>
                <a class="settings-link calendar-export" href="/api/calendar.ics">Export .ics</a>
            </div>
            <div id="loading" class="loading" role="status" aria-live="polite">
                Loading calendar…
            </div>
            <div class="calendar-scroll">
                <div class="calendar-weekdays" aria-hidden="true" role="presentation">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </div>
        </section>
    </div>
    <script src="/assignments-search.js"></script>
    <script>
        const calendarGridElement = document.getElementById("calendar-grid")
        const monthTitleElement = document.getElementById("month-title")
        const loadingTextElement = document.getElementById("loading")
        let calendarItems = new Map()
        let viewDate = startOfMonth(new Date())
        const items = fetchCalendarItems()
        init()
        window.initAssignmentsSearch({ mountId: "assignments-search" })
        async function init() {
            loadingTextElement.textContent = "Loading..."
            const itemList = await items
            if (itemList) {
                calendarItems = groupByDay(itemList)
            }
            renderCalendar()
            loadingTextElement.textContent = ""
            loadingTextElement.style.display = "none"
        }
        function normalizeItem(material, overdue) {
            const sectionId = material.parent?.section_id
            const folderId = material.parent?.folder_id || "root"
            return {
                title: material.title || "Untitled",
                due: material.dueDate ? new Date(material.dueDate) : new Date(NaN),
                url: `/section/${sectionId}/folder/${folderId}/material/${material.id}`,
                overdue,
            }
        }
        async function fetchMaterials(url, overdue) {
            let attemptCount = 0
            while (true) {
                try {
                    const response = await fetchWithRetry(url)
                    const data = await response.json()
                    if (data.status === "error") {
                        loadingTextElement.textContent = "Failed to load assignments."
                        console.error(data.message)
                        return []
                    }
                    return (data.materials || []).map((material) =>
                        normalizeItem(material, overdue),
                    )
                }
                catch (error) {
                    attemptCount++
                    loadingTextElement.textContent = `${attemptCount > 1 ? `Attempt ${attemptCount}: ` : ""}Failed to load assignments. Retrying...`
                    console.error("Error fetching assignments:", error)
                }
            }
        }
        async function fetchCalendarItems() {
            const [upcoming, overdue] = await Promise.all([
                fetchMaterials("/api/upcoming", false),
                fetchMaterials("/api/overdue", true),
            ])
            return [...upcoming, ...overdue].filter(
                (item) => !Number.isNaN(item.due.getTime()),
            )
        }
        function startOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1)
        }
        function groupByDay(itemList) {
            const grouped = new Map()
            for (const item of itemList) {
                const key = item.due.toDateString()
                if (!grouped.has(key)) {
                    grouped.set(key, [])
                }
                grouped.get(key).push(item)
            }
            for (const dayItems of grouped.values()) {
                dayItems.sort((itemOne, itemTwo) => itemOne.due - itemTwo.due)
            }
            return grouped
        }
        function renderCalendar() {
            calendarGridElement.innerHTML = ""
            monthTitleElement.textContent = viewDate.toLocaleString(undefined, {
                month: "long",
                year: "numeric",
            })
            const dayTemplate = document.getElementById("day-template")
            const itemTemplate = document.getElementById("item-template")
            const todayKey = new Date().toDateString()
            const firstCell = new Date(viewDate)
            firstCell.setDate(1 - viewDate.getDay())
            for (let index = 0; index < 42; index++) {
                const date = new Date(firstCell)
                date.setDate(firstCell.getDate() + index)
                const dayClone = dayTemplate.content.cloneNode(true)
                const dayElement = dayClone.querySelector(".calendar-day")
                const dayNumber = dayClone.querySelector(".calendar-day-number")
                dayNumber.textContent = date.getDate()
                if (date.getMonth() !== viewDate.getMonth()) {
                    dayElement.classList.add("calendar-day-other")
                }
                if (date.toDateString() === todayKey) {
                    dayElement.classList.add("calendar-day-today")
                }
                for (const item of calendarItems.get(date.toDateString()) || []) {
                    const itemClone = itemTemplate.content.cloneNode(true)
                    const itemLink = itemClone.querySelector(".calendar-item")
                    const time = item.due.toLocaleTimeString([], {
                        hour: "numeric",
                        minute: "2-digit",
                    })
                    itemLink.textContent = `${time} ${item.title}`
                    itemLink.title = item.title
                    itemLink.href = item.url
                    if (item.overdue) {
                        itemLink.classList.add("calendar-item-overdue")
                    }
                    dayElement.appendChild(itemClone)
                }
                calendarGridElement.appendChild(dayClone)
            }
        }
        function changeMonth(offset) {
            viewDate = new Date(
                viewDate.getFullYear(),
                viewDate.getMonth() + offset,
                1,
            )
            renderCalendar()
        }
        async function logout() {
            const button = document.getElementById("logout-button")
            button.disabled = true
            try {
                const response = await fetch("/api/logout", {
                    method: "POST",
                })
                const data = await response.json()
                if (data.status === "ok") {
                    window.location.href = "/login"
                    return
                }
                console.error("Logout failed:", data.message)
            }
            catch (error) {
                console.error("Error logging out:", error)
            }
            button.disabled = false
        }
        document
            .getElementById("prev-month")
            .addEventListener("click", () => changeMonth(-1))
        document
            .getElementById("next-month")
            .addEventListener("click", () => changeMonth(1))
        document.getElementById("today-button").addEventListener("click", () => {
            viewDate = startOfMonth(new Date())
            renderCalendar()
        })
        document
            .getElementById("logout-button")
            .addEventListener("click", logout)
    </script>
    <template id="day-template">
        <div class="calendar-day">
            <span class="calendar-day-number"></span>
        </div>
    </template>
    <template id="item-template">
        <a class="calendar-item"></a>
    </template>
</body>

</html>
