<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/logo.svg" />
  <title>Settings</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    .settings-page {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .settings-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .settings-header h1 {
      margin: 0;
      color: var(--text-strong);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.1;
    }

    .settings-header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .settings-card {
      display: grid;
      gap: 20px;
      padding: clamp(18px, 4vw, 28px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .settings-section {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .settings-section+.settings-section {
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .settings-section legend {
      padding: 0;
      color: var(--text-strong);
      font-size: 1rem;
      font-weight: 700;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      padding: 10px 0;
    }

    .setting-copy {
      min-width: 0;
    }

    .setting-label {
      display: block;
      color: var(--text);
      font-weight: 600;
    }

    .setting-help {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .setting-checkbox {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      accent-color: var(--accent);
    }

    .setting-row select {
      max-width: 46%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
      color: var(--text);
      color-scheme: dark;
    }

    .setting-row select option {
      background: var(--bg);
      color: var(--text);
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    .settings-button {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .settings-button.primary {
      border-color: var(--accent);
      background: linear-gradient(180deg,
          var(--accent),
          var(--accent-strong));
      color: white;
    }

    .settings-button:hover {
      filter: brightness(1.06);
    }

    @media (width <=560px) {
      body {
        padding: 16px;
      }

      .settings-header,
      .setting-row {
        align-items: stretch;
        flex-direction: column;
      }

      .setting-row select {
        max-width: none;
        width: 100%;
      }

      .settings-actions {
        justify-content: stretch;
      }

      .settings-button {
        flex: 1 1 140px;
      }
    }

    @media (width <=360px) {
      .settings-header h1 {
        font-size: 1.6rem;
      }

      .settings-card {
        padding: 16px;
      }

      .settings-actions {
        flex-direction: column;
      }

      .settings-button {
        width: 100%;
      }
    }
  </style>
  <script src="/app.js"></script>
  <script src="/back.js"></script>
</head>

<body class="app-page app-page--settings">
  <main class="settings-page">
  <a class="back-btn" data-back-button data-back-fallback="/home"></a>
  <header class="settings-header">
    <div>
      <h1>Settings</h1>
      <p>Adjust how Schoology looks and behaves on this device.</p>
    </div>
    <div class="settings-header-actions" style="display:flex;gap:8px;flex-wrap:wrap">
        <a id="return-link" class="settings-link" href="/home">Home</a>
      </div>
    </header>

    <form id="settings-form" class="settings-card">
      <fieldset class="settings-section">
        <legend>Appearance</legend>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-label">Reduce motion</span>
            <span class="setting-help">Minimize transitions and animated loading states.</span>
          </span>
          <input id="reduced-motion" class="setting-checkbox" type="checkbox" />
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-label">Show assignments</span>
            <span class="setting-help">Show the overdue and upcoming panel on supported pages.</span>
          </span>
          <input id="show-assignments" class="setting-checkbox" type="checkbox" />
        </label>
        <label class="setting-row" for="due-date-display">
          <span class="setting-copy">
            <span class="setting-label">Upcoming due dates</span>
            <span class="setting-help">Show upcoming due dates as a weekday, like "Monday", or as a
              plain date.</span>
          </span>
          <select id="due-date-display">
            <option value="relative">Weekday (e.g. Monday)</option>
            <option value="date">Date</option>
          </select>
        </label>
      </fieldset>

      <fieldset class="settings-section">
        <legend>Course materials</legend>
        <label class="setting-row" for="view-mode">
          <span class="setting-copy">
            <span class="setting-label">View Mode</span>
            <span class="setting-help">Choose how course materials open by default.</span>
          </span>
          <select id="view-mode">
            <option value="tree">Tree</option>
            <option value="explorer">Explorer</option>
          </select>
        </label>
        <label class="setting-row" for="sort-mode">
          <span class="setting-copy">
            <span class="setting-label">Sort Mode</span>
            <span class="setting-help">Choose the order used for material lists.</span>
          </span>
          <select id="sort-mode">
            <option value="default">Default</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="type">Type</option>
          </select>
        </label>
        <label class="setting-row" for="folder-color-mode">
          <span class="setting-copy">
            <span class="setting-label">Folder colors</span>
            <span class="setting-help">Choose how folder icons are colored in course materials.</span>
          </span>
          <select id="folder-color-mode">
            <option value="none">No color</option>
            <option value="Schoology">Schoology color</option>
            <option value="random">Random color</option>
          </select>
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-label">Remember expanded folders</span>
            <span class="setting-help">Reopen the folders you had expanded in tree view when you come
              back.</span>
          </span>
          <input id="remember-expanded-folders" class="setting-checkbox" type="checkbox" />
        </label>
      </fieldset>

      <div class="settings-actions">
        <button id="reset-button" class="settings-button" type="button">
          Reset defaults
        </button>
        <button class="settings-button primary" type="submit">
          Save settings
        </button>
      </div>
    </form>
  </main>

  <script>
    const settingsKeys = window.SETTINGS_KEYS
const defaults = window.DEFAULT_SETTINGS

const form = document.getElementById("settings-form")
const returnLink = document.getElementById("return-link")
const returnPath = new URLSearchParams(window.location.search).get(
      "return",
    )
const safeReturnPath = window.toSafeAppPath(returnPath) || "/home"

returnLink.href = safeReturnPath
if (safeReturnPath !== "/home") returnLink.textContent = "Return"

document.querySelector("[data-back-button]").dataset.backFallback = safeReturnPath

function readSetting(key, fallback) {
      try {
        const value = localStorage.getItem(key)
    return value === null ? fallback : value
  }
 catch (error) {
        console.error("Unable to read setting:", error)
    return fallback
  }
    }

    function writeSetting(key, value) {
      localStorage.setItem(key, value)
}

    function loadSettings() {
      document.getElementById("reduced-motion").checked =    readSetting(
          settingsKeys.reducedMotion,
          String(defaults.reducedMotion),
        ) === "true"
  document.getElementById("show-assignments").checked =    readSetting(
          settingsKeys.showAssignments,
          String(defaults.showAssignments),
        ) === "true"
  document.getElementById("due-date-display").value = readSetting(
        settingsKeys.dueDateDisplay,
        defaults.dueDateDisplay,
      )
  document.getElementById("view-mode").value = readSetting(
        settingsKeys.viewMode,
        defaults.viewMode,
      )
  document.getElementById("sort-mode").value = readSetting(
        settingsKeys.sortMode,
        defaults.sortMode,
      )
  document.getElementById("folder-color-mode").value = readSetting(
        settingsKeys.folderColorMode,
        defaults.folderColorMode,
      )
  document.getElementById("remember-expanded-folders").checked =    readSetting(
          settingsKeys.rememberExpandedFolders,
          String(defaults.rememberExpandedFolders),
        ) === "true"
}

    function saveSettings() {
      writeSetting(
        settingsKeys.reducedMotion,
        String(document.getElementById("reduced-motion").checked),
      )
  writeSetting(
        settingsKeys.showAssignments,
        String(document.getElementById("show-assignments").checked),
      )
  writeSetting(
        settingsKeys.dueDateDisplay,
        document.getElementById("due-date-display").value,
      )
  writeSetting(
        settingsKeys.viewMode,
        document.getElementById("view-mode").value,
      )
  writeSetting(
        settingsKeys.sortMode,
        document.getElementById("sort-mode").value,
      )
  writeSetting(
        settingsKeys.folderColorMode,
        document.getElementById("folder-color-mode").value,
      )
  writeSetting(
        settingsKeys.rememberExpandedFolders,
        String(document.getElementById("remember-expanded-folders").checked),
      )
}

    function resetSettings() {
      writeSetting(
        settingsKeys.reducedMotion,
        String(defaults.reducedMotion),
      )
  writeSetting(
        settingsKeys.showAssignments,
        String(defaults.showAssignments),
      )
  writeSetting(settingsKeys.dueDateDisplay, defaults.dueDateDisplay)
  writeSetting(settingsKeys.viewMode, defaults.viewMode)
  writeSetting(settingsKeys.sortMode, defaults.sortMode)
  writeSetting(settingsKeys.folderColorMode, defaults.folderColorMode)
  writeSetting(
        settingsKeys.rememberExpandedFolders,
        String(defaults.rememberExpandedFolders),
      )
  loadSettings()
}

    form.addEventListener("submit", (event) => {
      event.preventDefault()
  saveSettings()
  window.location.href = safeReturnPath
})

document
      .getElementById("reset-button")
      .addEventListener("click", resetSettings)
loadSettings()
  </script>
</body>

</html>
